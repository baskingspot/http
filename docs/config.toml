# The http guide, served at baskingspot.dev/http/. The theme and the site build
# come from baskingspot-docs; the router in baskingspot/site serves /http/...
base_url = "https://baskingspot.dev/http"
theme = "baskingspot"
title = "http"
description = "HTTP/1.1 and HTTP/2 in Zig: field-value parsers, sans-I/O connection machines, and the engines you build a server or client on."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/http"
api = true
