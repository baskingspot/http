name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version without the leading v, such as 0.1.0
        required: true

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    uses: baskingspot/gh-actions/.github/workflows/release-library.yml@a8c8fd0d7e28ac1ceffd1c0eb4dc642f09756c60 # v0.13.3
    with:
      version: ${{ inputs.version }}
